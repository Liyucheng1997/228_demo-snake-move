<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>蛇类三维图鉴 · Snakes 3D</title>
<style>
  :root{
    --bg:#0b1110; --glass:rgba(13,20,18,.74); --glass2:rgba(255,255,255,.045); --line:rgba(160,220,190,.14);
    --txt:#e4efe8; --muted:#8fae9f; --acc:#6fe3a8; --acc2:#f0bf5a; --warn:#ef7a6a;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .labels{position:fixed!important;inset:0;pointer-events:none}
  .glass{position:fixed;background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
    border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
  button{font:inherit;font-size:12.5px;color:var(--txt);background:var(--glass2);border:1px solid var(--line);
    border-radius:10px;padding:7px 10px;cursor:pointer;transition:background .15s,border-color .15s,color .15s,opacity .15s}
  button:hover:not(:disabled){background:rgba(111,227,168,.12);border-color:rgba(111,227,168,.6)}
  button.on{background:var(--acc);color:#062417;border-color:var(--acc);font-weight:600}
  button:disabled{opacity:.3;cursor:not-allowed}

  /* ---------- 左侧面板 ---------- */
  #panel{top:12px;left:12px;bottom:12px;width:300px;overflow-y:auto;padding:14px 14px 10px;transition:transform .35s}
  #panel::-webkit-scrollbar{width:6px} #panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  #panel header{position:relative;margin-bottom:6px}
  #panel h1{margin:0;font-size:17px;letter-spacing:.5px}
  #panel .sub{color:var(--muted);font-size:11px;margin-top:3px}
  #collapse{position:absolute;right:0;top:0;padding:3px 9px}
  section{margin-top:14px}
  section h3{margin:0 0 8px;font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .card{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 9px 7px;border-radius:12px;position:relative;overflow:hidden}
  .card .nm{font-size:13.5px;font-weight:600}
  .card .lt{font-size:9.5px;color:var(--muted);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .card.on .lt{color:#0c3a26}
  .card .vn{position:absolute;right:7px;top:14px;display:flex;gap:2px}
  .card .vn .v{width:6px;height:6px;border-radius:50%;background:var(--warn);box-shadow:0 0 5px var(--warn)}
  .card .vn .nv{font-style:normal;font-size:9px;color:var(--acc)}
  .card.on .vn .nv{color:#0c3a26}
  .sw{display:block;width:100%;height:9px;border-radius:5px;margin-bottom:4px;
    background:repeating-linear-gradient(115deg,var(--a) 0 9px,var(--b) 9px 15px,var(--c) 15px 17px,var(--a) 17px 24px)}
  .sw.big{width:54px;height:54px;border-radius:12px;flex:none;margin:0}
  .btns{display:flex;flex-wrap:wrap;gap:6px}
  .btns button{flex:1 1 auto}
  #acts button{display:flex;align-items:center;gap:6px;justify-content:flex-start;flex:1 1 calc(50% - 6px)}
  #acts button span{font-size:15px}
  #acts button.on{background:var(--acc2);border-color:var(--acc2);color:#2a1a00}
  .toggle{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12.5px;color:var(--txt);cursor:pointer}
  .toggle input{accent-color:var(--acc2);width:15px;height:15px}
  .row{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:8px}
  .row input[type=range]{flex:1;accent-color:var(--acc)}
  .val{color:var(--acc);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
  .hint{font-size:10.5px;color:var(--muted);margin-top:14px;line-height:1.6}
  body.collapsed #panel{transform:translateX(calc(-100% + 44px))}
  body.collapsed #panel > :not(header){visibility:hidden}

  /* ---------- HUD ---------- */
  #hud{top:12px;right:12px;width:258px;padding:12px 14px;font-size:12px}
  #hud .sp b{font-size:16px;margin-right:6px}
  #hud .sp span{font-size:11px;color:var(--muted);font-style:italic}
  #hud .fam{font-size:11px;color:var(--muted);margin:3px 0 9px}
  #hud .state{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:9px;background:rgba(111,227,168,.08);border:1px solid rgba(111,227,168,.2);margin-bottom:9px}
  #hud .state i{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .vit{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .vit div{background:var(--glass2);border:1px solid var(--line);border-radius:9px;padding:5px 8px}
  .vit small{display:block;color:var(--muted);font-size:10px}
  .vit b{font-variant-numeric:tabular-nums;font-size:13px;color:var(--acc)}

  /* ---------- 信息卡 ---------- */
  #info{right:12px;bottom:12px;width:390px;max-height:46vh;display:flex;flex-direction:column;padding:10px 14px 12px}
  #info .tabs{display:flex;gap:6px;margin-bottom:8px;padding-right:30px}
  #info .tabs button{padding:4px 11px;font-size:11.5px}
  #infoMin{position:absolute;right:10px;top:9px;padding:2px 9px}
  #infoNow,#infoProfile{overflow-y:auto}
  #info.min{max-height:48px;overflow:hidden}
  #info.min #infoNow,#info.min #infoProfile{display:none}
  .tag{display:inline-block;font-size:10px;color:var(--acc2);border:1px solid rgba(240,191,90,.45);border-radius:6px;padding:1px 7px}
  #info h2{margin:6px 0 6px;font-size:15px;color:var(--acc)}
  #info h2 small{font-size:11px;color:var(--muted);font-weight:400}
  #info p{margin:0 0 8px;font-size:12.6px;line-height:1.72}
  #infoProfile .ph{display:flex;gap:11px;align-items:center;margin-bottom:8px}
  #infoProfile h2{margin:0}
  #infoProfile .lat{font-size:11px;color:var(--muted);font-style:italic}
  #infoProfile table{width:100%;border-collapse:collapse;font-size:12px}
  #infoProfile th{text-align:left;color:var(--muted);font-weight:500;padding:5px 8px 5px 0;white-space:nowrap;vertical-align:top;width:48px}
  #infoProfile td{padding:5px 0;border-bottom:1px solid var(--line);line-height:1.5}

  /* ---------- 阶段条 / 字幕 ---------- */
  #stages{position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);display:flex;align-items:center;gap:4px;
    padding:7px 10px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);
    opacity:0;transition:.35s;pointer-events:none;width:max-content;max-width:max(360px,calc(100vw - 760px));flex-wrap:wrap;justify-content:center}
  #stages.show{opacity:1;transform:translate(-50%,0)}
  .chip{font-size:11.5px;padding:4px 9px;border-radius:9px;color:var(--muted);white-space:nowrap;transition:.25s}
  .chip b{display:inline-block;width:15px;height:15px;line-height:15px;text-align:center;border-radius:50%;font-size:9.5px;margin-right:5px;background:rgba(255,255,255,.08)}
  .chip.done{color:rgba(111,227,168,.7)} .chip.done b{background:rgba(111,227,168,.25)}
  .chip.now{background:var(--acc2);color:#2a1a00;font-weight:600} .chip.now b{background:rgba(0,0,0,.18)}
  .arr{color:var(--muted);font-style:normal;opacity:.5}
  #caption{position:fixed;left:50%;top:22px;transform:translate(-50%,-8px);width:max-content;max-width:min(640px,max(320px,calc(100vw - 660px)));text-align:center;
    font-size:16px;line-height:1.55;padding:9px 18px;border-radius:12px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);
    opacity:0;transition:.4s;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  #caption.show{opacity:1;transform:translate(-50%,0)}
  #tbadge{position:fixed;left:50%;top:0;transform:translate(-50%,-40px);padding:5px 14px;border-radius:0 0 10px 10px;
    background:rgba(240,191,90,.92);color:#2a1a00;font-size:12px;font-weight:600;transition:.35s;pointer-events:none}
  #tbadge.show{transform:translate(-50%,0)}

  /* ---------- 3D 标签 ---------- */
  .lbl{font-size:11px;padding:2px 7px 2px 5px;border-radius:7px;background:rgba(8,12,11,.72);color:#eef;white-space:nowrap;
    border:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:5px;transform:translateY(-14px)}
  .lbl i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .lbl.den{font-size:12.5px;padding:4px 10px;background:rgba(10,16,24,.75)}
  .lbl.den b{color:var(--acc2);margin-left:4px}
  .lbl.frost{color:#aee0ff;border-color:rgba(140,200,255,.5)}

  /* ---------- 覆盖层 ---------- */
  #fade{position:fixed;inset:0;background:#05080a;opacity:0;pointer-events:none;z-index:20}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    background:radial-gradient(circle at 50% 40%,#13201c,#070b0a);z-index:30;color:var(--muted);font-size:14px;transition:opacity .6s}
  #loader.hide{opacity:0;pointer-events:none}
  #loader .logo{font-size:44px;animation:bob 2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
  #busy{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 22px;border-radius:14px;background:rgba(0,0,0,.7);
    font-size:13px;display:none;align-items:center;gap:12px;z-index:25}
  #busy.show{display:flex}
  .spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 1s linear infinite}
  #loader .spin{width:34px;height:34px}
  @keyframes s{to{transform:rotate(360deg)}}

  @media (max-width: 1280px){
    #stages{bottom:auto;top:12px;max-width:max(320px,calc(100vw - 640px))}
    #caption{top:auto;bottom:40px;max-width:max(300px,calc(100vw - 760px))}
    #tbadge{top:auto;bottom:0;border-radius:10px 10px 0 0;transform:translate(-50%,40px)}
    #tbadge.show{transform:translate(-50%,0)}
  }
  @media (max-width: 900px){
    #panel{width:270px}
    #info{width:calc(100vw - 24px);max-height:34vh}
    #hud{width:200px;padding:9px 10px} .vit{grid-template-columns:1fr}
    #stages{max-width:calc(100vw - 24px);bottom:auto;top:62px}
    #caption{max-width:calc(100vw - 24px);font-size:14px}
    body:not(.collapsed) #hud{display:none}
  }
</style>
</head>
<body>
<div id="app"></div>

<aside id="panel" class="glass">
  <header>
    <h1>🐍 蛇类三维图鉴</h1>
    <div class="sub">8 种常见蛇 · 形态 · 运动 · 行为 · 生活史</div>
    <button id="collapse" title="收起/展开面板">⟨</button>
  </header>
  <section><h3>物种 Species</h3><div id="species" class="grid"></div></section>
  <section>
    <h3>行为与习性 Behavior</h3>
    <div id="acts" class="btns"></div>
    <label class="toggle"><input type="checkbox" id="auto" /> 自动生活：循环演示它的一生</label>
  </section>
  <section><h3>运动方式 Locomotion</h3><div id="gaits" class="btns"></div></section>
  <section><h3>观察 View</h3><div id="views" class="btns"></div></section>
  <section>
    <h3>环境 Settings</h3>
    <div class="btns"><button id="nightBtn">☀️ 白天</button><button id="soundBtn">🔊 声音</button></div>
    <div class="row"><span>时间流速</span><input id="speed" type="range" min="0.1" max="2" step="0.05" value="1" /><span class="val" id="speedV">1.00×</span></div>
  </section>
  <div class="hint">拖拽旋转 · 滚轮缩放 · 右键平移<br />镜头会自动跟随蛇；防御演示中，<b>镜头就是它眼中的威胁者</b>。</div>
</aside>

<div id="hud" class="glass">
  <div class="sp"><b id="hName"></b><span id="hLatin"></span></div>
  <div class="fam" id="hFam"></div>
  <div class="state"><i></i><span id="hState">…</span></div>
  <div class="vit">
    <div><small>体温</small><b id="vTemp">—</b></div>
    <div><small>心率</small><b id="vHr">—</b></div>
    <div><small>代谢率</small><b id="vMet">—</b></div>
    <div><small>气温 · <span id="vSeason"></span></small><b id="vAir">—</b></div>
    <div hidden><small>消化进度</small><b id="vDig">—</b></div>
  </div>
</div>

<div id="caption"></div>
<div id="tbadge"></div>
<div id="stages"></div>

<div id="info" class="glass">
  <div class="tabs"><button data-tab="now" class="on">当前讲解</button><button data-tab="profile">物种档案</button></div>
  <button id="infoMin" title="收起">–</button>
  <div id="infoNow"><span class="tag" id="iTag"></span><h2 id="iTitle"></h2><div id="iText"></div></div>
  <div id="infoProfile" hidden></div>
</div>

<div id="busy"><div class="spin"></div><span id="busyMsg"></span></div>
<div id="fade"></div>
<div id="loader"><div class="logo">🐍</div><div class="spin"></div><div id="loadMsg">正在加载 Three.js 引擎…</div></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

window.THREE = THREE;
window.ADDONS = { OrbitControls, RoomEnvironment, CSS2DRenderer, CSS2DObject, BufferGeometryUtils };
// 逻辑代码以普通脚本按顺序加载（本地双击打开 file:// 也能运行）
const files = ['util', 'species', 'skin', 'snake', 'prey', 'world', 'behavior', 'audio', 'ui', 'main'];
const msg = document.getElementById('loadMsg');
try {
  for (const f of files) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = `js/${f}.js` + (location.protocol === 'file:' ? '' : `?v=${Date.now()}`); s.onload = res; s.onerror = () => rej(new Error(`无法加载 js/${f}.js`));
      document.body.appendChild(s);
    });
  }
  await window.startApp();
} catch (e) { msg.textContent = '加载失败：' + e.message; console.error(e); }
</script>
</body>
</html>
